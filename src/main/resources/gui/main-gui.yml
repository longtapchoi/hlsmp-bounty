gui-main:
  title: "&8ʙᴏᴜɴᴛʏ (Page %page%/%max%)"
  rows: 6
  slots-bounty: 0-44
  items:
    bounty-head:
      name: "&#00fc88%name%"
      lore:
        - "&fBounty: &7$%bounty%"
    search:
      name: "&#00fc88sᴇᴀʀᴄʜ"

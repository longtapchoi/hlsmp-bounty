      slot: 50
      lore:
        - "&fClick to search."
    previous-page:
      name: '&#00fc88ᴘʀᴇᴠɪᴏᴜꜱ'
      material: ARROW
      slot: 45
      lore:
        - "&fClick to navigate."
    refresh:
      name: "&#00fc88ʙᴏᴜɴᴛʏ"
      material: SKELETON_SKULL
      slot: 49
      lore:
        - "&fClick to refresh"
